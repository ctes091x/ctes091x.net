version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 公開から7日経っていない版は提案しない (乗っ取られたパッケージ対策)
    cooldown:
      default-days: 7
    groups:
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "@catppuccin/tailwindcss"]
      astro:
        patterns: ["astro", "@astrojs/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
